# Corre las pruebas de las reglas (tests/test_reglas.py) cada vez que se sube un cambio.
# El resultado se ve en la pestaña Actions del repositorio y en la insignia del README.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # reglas.py solo usa la biblioteca estándar: basta con pytest
      - run: pip install pytest
      - run: python -m pytest -v tests
